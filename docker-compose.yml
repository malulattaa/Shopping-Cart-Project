services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopping_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: ${MONGO_URI}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
    networks:
      - shopping_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopping_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    networks:
      - shopping_net
    depends_on:
      - backend

networks:
  shopping_net:
    driver: bridge
